<!DOCTYPE html><html lang="it" data-bs-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}ReminderHub{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:linear-gradient(180deg,#f8f9fa 0%,#e9ecef 100%);min-height:100vh}[data-bs-theme=dark] body{background:linear-gradient(180deg,#1a1d23 0%,#0d1117 100%)}.navbar{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important}.reminder-card{transition:all .25s ease;border-left:5px solid #dee2e6}.reminder-card:hover{transform:translateY(-3px)}.status-overdue{border-left-color:#dc3545}.status-today{border-left-color:#ffc107}.status-urgent{border-left-color:#fd7e14}.status-soon{border-left-color:#0dcaf0}.status-ok{border-left-color:#198754}.status-checked{border-left-color:#6c757d;opacity:.7}.status-badge{font-size:.75rem;padding:.25rem .6rem;border-radius:1rem;font-weight:600}</style></head><body><nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="/"><i class="bi bi-bell-fill me-2"></i>ReminderHub</a><div class="d-flex align-items-center"><button id="themeToggle" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-moon-stars-fill"></i></button><a href="/add" class="btn btn-light"><i class="bi bi-plus-lg me-1"></i>Nuovo</a></div></div></nav><main class="container py-4">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script>const t=document.getElementById('themeToggle'),h=document.documentElement,s=localStorage.getItem('theme')||'light';h.setAttribute('data-bs-theme',s);t.innerHTML=s==='light'?'<i class="bi bi-moon-stars-fill"></i>':'<i class="bi bi-sun-fill"></i>';t.addEventListener('click',()=>{const n=h.getAttribute('data-bs-theme')==='light'?'dark':'light';h.setAttribute('data-bs-theme',n);localStorage.setItem('theme',n);t.innerHTML=n==='light'?'<i class="bi bi-moon-stars-fill"></i>':'<i class="bi bi-sun-fill"></i>'});</script></body></html>
