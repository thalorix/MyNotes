{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm">
  <div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-{{ 'pencil-square' if reminder else 'plus-circle' }} me-2"></i>{{ 'Modifica' if reminder else 'Nuovo' }} promemoria</h4></div>
  <div class="card-body p-4"><form method="post">
    <div class="mb-3"><label class="form-label fw-semibold">Titolo *</label><input type="text" name="title" class="form-control form-control-lg" value="{{ reminder.title if reminder else '' }}" required placeholder="Es. Pagare prima rata università"></div>
    <div class="mb-3"><label class="form-label fw-semibold">Descrizione</label><textarea name="description" class="form-control" rows="3">{{ reminder.description if reminder else '' }}</textarea></div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-semibold">Categoria</label><select name="category" class="form-select">{% for cat in categories %}<option value="{{ cat }}" {% if reminder and reminder.category==cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Priorità</label><select name="priority" class="form-select">{% for p in ['bassa','media','alta'] %}<option value="{{ p }}" {% if reminder and reminder.priority==p %}selected{% endif %}>{{ p|capitalize }}</option>{% endfor %}</select></div>
    </div>
    <div class="mb-4 mt-3"><label class="form-label fw-semibold">Data scadenza *</label><input type="date" name="due_date" class="form-control" value="{{ reminder.due_date.strftime('%Y-%m-%d') if reminder else '' }}" required></div>
    <div class="d-flex gap-2"><button type="submit" class="btn btn-primary flex-fill">Salva</button><a href="/" class="btn btn-outline-secondary">Annulla</a></div>
  </form></div>
</div></div></div>{% endblock %}
